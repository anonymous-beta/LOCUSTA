services:
  locusta-c2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.c2

    container_name: locusta-c2

    ports:
      - "8443:8443"

    environment:
      LOCUSTA_SECRET: ${LOCUSTA_SECRET}
      LOCUSTA_JWT_SECRET: ${LOCUSTA_JWT_SECRET}
      LOCUSTA_ADMIN_PASS: ${LOCUSTA_ADMIN_PASS}

      LOCUSTA_PORT: ${LOCUSTA_PORT:-8443}
      LOCUSTA_DB: ${LOCUSTA_DB:-/app/data/locusta.db}

      LOCUSTA_AI_ENABLED: ${LOCUSTA_AI_ENABLED:-false}
      LOCUSTA_AI_PROVIDER: ${LOCUSTA_AI_PROVIDER:-openai}
      LOCUSTA_AI_KEY: ${LOCUSTA_AI_KEY:-}
      LOCUSTA_AI_MODEL: ${LOCUSTA_AI_MODEL:-gpt-4}

      LOCUSTA_CORS: ${LOCUSTA_CORS:-http://localhost:3000}

    volumes:
      - locusta-data:/app/data

    restart: unless-stopped

    networks:
      - hive-network

  locusta-frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend

    container_name: locusta-frontend

    ports:
      - "3000:80"

    depends_on:
      - locusta-c2

    restart: unless-stopped

    networks:
      - hive-network

volumes:
  locusta-data:

networks:
  hive-network:
    driver: bridge