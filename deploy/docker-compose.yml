version: '3.8'

services:
  locusta-c2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.c2
    ports:
      - "8443:8443"
      - "9443:9443"
    environment:
      - LOCUSTA_SECRET=${LOCUSTA_SECRET}
      - LOCUSTA_JWT_SECRET=${LOCUSTA_JWT_SECRET}
      - LOCUSTA_ADMIN_PASS=${LOCUSTA_ADMIN_PASS}
      - LOCUSTA_AI_ENABLED=${LOCUSTA_AI_ENABLED:-true}
      - LOCUSTA_AI_PROVIDER=${LOCUSTA_AI_PROVIDER:-openai}
      - LOCUSTA_AI_KEY=${LOCUSTA_AI_KEY}
      - LOCUSTA_AI_MODEL=${LOCUSTA_AI_MODEL:-gpt-4}
    volumes:
      - locusta-data:/app/data
      - ./ssl:/app/ssl:ro
    restart: unless-stopped
    networks:
      - hive-network

  locusta-frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - locusta-c2
    restart: unless-stopped
    networks:
      - hive-network

  locusta-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=locusta
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=locusta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - hive-network

volumes:
  locusta-data:
  postgres-data:

networks:
  hive-network:
    driver: bridge
