name: LOCUSTA Safe CI

on:
  workflow_dispatch:
    inputs:
      run_docker_builds:
        description: 'Build backend and frontend Docker images'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: locusta-safe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Flask backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify backend files
        run: |
          set -eu
          test -f backend/app.py || { echo 'ERROR: backend/app.py is missing'; exit 1; }
          test -f backend/requirements.txt || { echo 'ERROR: backend/requirements.txt is missing'; exit 1; }

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q backend

      - name: Check Flask app import and health route
        working-directory: backend
        env:
          LOCUSTA_DB: ${{ runner.temp }}/locusta-ci.db
          LOCUSTA_PORT: '8443'
          LOCUSTA_AI_KEY: ''
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          try:
              import app as locusta_app
          except Exception as exc:
              print(f'ERROR: backend app import failed: {exc!r}')
              raise

          flask_app = getattr(locusta_app, 'app', None)
          if flask_app is None:
              raise SystemExit('ERROR: backend/app.py does not expose a Flask app named app')

          rules = {rule.rule for rule in flask_app.url_map.iter_rules()}
          if '/api/health' not in rules:
              raise SystemExit('ERROR: /api/health route is not registered. Add the health endpoint before enabling this check.')

          client = flask_app.test_client()
          response = client.get('/api/health')
          if response.status_code != 200:
              raise SystemExit(f'ERROR: /api/health returned HTTP {response.status_code}')

          try:
              body = response.get_json()
          except Exception:
              body = None
          if not isinstance(body, dict) or body.get('status') != 'ok':
              raise SystemExit(f'ERROR: /api/health returned unexpected JSON: {body!r}')

          print('PASS: Flask app imports and /api/health returns HTTP 200 with status=ok')
          PY

  frontend-config-checks:
    name: Frontend and Docker context validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frontend build files
        run: |
          set -eu
          test -f deploy/Dockerfile.frontend || { echo 'ERROR: deploy/Dockerfile.frontend is missing'; exit 1; }
          test -f deploy/nginx.conf || { echo 'ERROR: deploy/nginx.conf is missing'; exit 1; }
          test -f deploy/docker-compose.yml || { echo 'ERROR: deploy/docker-compose.yml is missing'; exit 1; }
          test -f frontend/package.json || { echo 'ERROR: frontend/package.json is missing'; exit 1; }
          echo 'PASS: required frontend and deployment files exist'

      - name: Verify frontend Docker COPY source
        run: |
          set -eu
          grep -F 'COPY deploy/nginx.conf /etc/nginx/conf.d/default.conf' deploy/Dockerfile.frontend || {
            echo 'INFO: The Dockerfile does not contain the exact COPY instruction previously reported.'
          }
          test -f deploy/nginx.conf
          echo 'PASS: deploy/nginx.conf exists relative to the repository-root build context'

      - name: Validate Compose configuration and frontend context
        run: |
          set -eu
          docker compose -f deploy/docker-compose.yml config --quiet
          python - <<'PY'
          import subprocess
          import sys

          output = subprocess.check_output(
              ['docker', 'compose', '-f', 'deploy/docker-compose.yml', 'config', '--format', 'json'],
              text=True,
          )
          import json
          config = json.loads(output)
          services = config.get('services', {})
          frontend = services.get('locusta-frontend')
          if not frontend:
              raise SystemExit('ERROR: Compose service locusta-frontend was not found')

          build = frontend.get('build')
          if isinstance(build, str):
              context = build
              dockerfile = 'Dockerfile'
          elif isinstance(build, dict):
              context = build.get('context', '.')
              dockerfile = build.get('dockerfile', 'Dockerfile')
          else:
              raise SystemExit('ERROR: locusta-frontend has no valid build configuration')

          print(f'Frontend build context: {context}')
          print(f'Frontend Dockerfile: {dockerfile}')

          # Compose resolves relative contexts from the Compose file directory.
          from pathlib import Path
          compose_dir = Path('deploy').resolve()
          context_path = Path(context)
          if not context_path.is_absolute():
              context_path = (compose_dir / context_path).resolve()
          dockerfile_path = Path(dockerfile)
          if not dockerfile_path.is_absolute():
              dockerfile_path = (context_path / dockerfile_path).resolve()

          if not context_path.is_dir():
              raise SystemExit(f'ERROR: frontend build context does not exist: {context_path}')
          if not dockerfile_path.is_file():
              raise SystemExit(f'ERROR: frontend Dockerfile does not exist: {dockerfile_path}')

          nginx_source = context_path / 'deploy' / 'nginx.conf'
          if 'COPY deploy/nginx.conf /etc/nginx/conf.d/default.conf' in dockerfile_path.read_text():
              if not nginx_source.is_file():
                  raise SystemExit(
                      'ERROR: Dockerfile expects deploy/nginx.conf inside the build context, '
                      f'but it was not found at {nginx_source}. Set the frontend context to the repository root.'
                  )
          print('PASS: frontend build context contains the expected Dockerfile COPY source')
          PY

  docker-builds:
    name: Docker image build validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-config-checks]
    if: ${{ inputs.run_docker_builds }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f deploy/Dockerfile.c2 -t locusta-c2:ci .

      - name: Build frontend image
        run: docker build -f deploy/Dockerfile.frontend -t locusta-frontend:ci .

  ci-summary:
    name: CI result
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-config-checks, docker-builds]
    if: ${{ always() }}
    steps:
      - name: Report outcome
        env:
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-config-checks.result }}
          DOCKER_RESULT: ${{ needs.docker-builds.result }}
        run: |
          echo "Backend checks: $BACKEND_RESULT"
          echo "Frontend checks: $FRONTEND_RESULT"
          echo "Docker builds: $DOCKER_RESULT"
          if [ "$BACKEND_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ]; then
            echo 'One or more required checks failed.'
            exit 1
          fi
          if [ "$DOCKER_RESULT" != "success" ] && [ "$DOCKER_RESULT" != "skipped" ]; then
            echo 'Docker image build failed.'
            exit 1
          fi
          echo 'Required validation checks passed.'